esphome:
  name: rollus
  friendly_name: Rollus
  includes:
    - rollus_protocol.h
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            rollus.set_transmitter_fn([](const std::vector<int32_t> &pulses) {
              auto call = id(rf_transmitter).transmit();
              call.get_data()->set_data(pulses);
              call.perform();
            });
            // Registrierung der Rolläden mit individuellen Masken:
            // Parameter: ID, Cover, {b5, b7_offset}
            // rollus.register_shutter(0x2D, id(rolladen_1), {0xD8, 0x15});
            // rollus.register_shutter(0xAD, id(rolladen_2), {0xD8, 0x15});
            rollus.register_shutter(0x39, id(rolladen_3), {0x6E, 0x51});
            rollus.register_shutter(0xB9, id(rolladen_4), {0x6E, 0x51});
    - priority: -100
      then:
        - cc1101.begin_rx

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret rollus_api

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Rollus Fallback Hotspot
    password: !secret rollus_wififallback

captive_portal:

# Native SPI-Schnittstelle
spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# Native CC1101-Komponente
cc1101:
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: "ASK/OOK"

# Sender über GDO0 (Pin 21)
remote_transmitter:
  id: rf_transmitter
  pin: GPIO21
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

# Empfänger über GDO2 (Pin 22) - Erkennt und synchronisiert automatisch alle registrierten Fernbedienungen
remote_receiver:
  id: rf_receiver
  pin: GPIO22
  dump: []
  filter: 100us
  idle: 4ms
  buffer_size: 4000
  on_raw:
    then:
      - lambda: |-
          rollus.handleRxPulses(x);

# Cover-Entitäten für Home Assistant (schlanke 1-Zeiler pro Aktion)
cover:
  - platform: time_based
    name: "Schlafzimmer klein"
    id: rolladen_3
    open_action:
      - lambda: rollus.send(0x39, 0x81);
    open_duration: 24s
    close_action:
      - lambda: rollus.send(0x39, 0x21);
    close_duration: 21s
    stop_action:
      - lambda: rollus.send(0x39, 0x41);
    device_class: shutter
    has_built_in_endstop: true
  - platform: time_based
    name: "Schlafzimmer groß"
    id: rolladen_4
    open_action:
      - lambda: rollus.send(0xB9, 0x81);
    open_duration: 22s
    close_action:
      - lambda: rollus.send(0xB9, 0x21);
    close_duration: 21s
    stop_action:
      - lambda: rollus.send(0xB9, 0x41);
    device_class: shutter
    has_built_in_endstop: true

# Konfigurierbare Fahrzeiten für Home Assistant (Bereich Konfiguration)
number:
  # ==========================================
  # Schlafzimmer klein (rolladen_3, 0x39)
  # ==========================================
  - platform: template
    name: "Schlafzimmer klein Fahrzeit Öffnen"
    id: rolladen_3_open_time
    entity_category: config
    icon: "mdi:timer-outline"
    device_class: duration
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30
    on_value:
      then:
        - lambda: |-
            id(rolladen_3).set_open_duration(static_cast<uint32_t>(x * 1000));

  - platform: template
    name: "Schlafzimmer klein Fahrzeit Schließen"
    id: rolladen_3_close_time
    entity_category: config
    icon: "mdi:timer-outline"
    device_class: duration
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30
    on_value:
      then:
        - lambda: |-
            id(rolladen_3).set_close_duration(static_cast<uint32_t>(x * 1000));

  # ==========================================
  # Schlafzimmer groß (rolladen_4, 0xB9)
  # ==========================================
  - platform: template
    name: "Schlafzimmer groß Fahrzeit Öffnen"
    id: rolladen_4_open_time
    entity_category: config
    icon: "mdi:timer-outline"
    device_class: duration
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30
    on_value:
      then:
        - lambda: |-
            id(rolladen_4).set_open_duration(static_cast<uint32_t>(x * 1000));

  - platform: template
    name: "Schlafzimmer groß Fahrzeit Schließen"
    id: rolladen_4_close_time
    entity_category: config
    icon: "mdi:timer-outline"
    device_class: duration
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30
    on_value:
      then:
